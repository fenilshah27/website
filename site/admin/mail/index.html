<!DOCTYPE html>
<html lang="en">
<head>
<script src="/config.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mail — Fenil Book</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#1b1a17; --muted:#7d766b; --line:#e6e0d6; --off:#efeae2;
    --accent:#7a1f2b; --accent-soft:#f4e9ea; --ok:#2f6b3f; --ok-soft:#eaf3ec;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .hidden{display:none !important}
  button{font:inherit;color:inherit}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .note{font-size:13px;color:var(--muted)}
  .btn{font-family:var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;font-weight:500;padding:11px 20px;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn svg{width:16px;height:16px}
  .linkbtn{background:none;border:0;font-size:13px;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
  input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:0;outline:none}
  input:focus,select:focus{border-color:var(--ink)}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
  .msg{padding:11px 14px;font-size:14px;margin-top:14px;border-left:3px solid var(--accent);background:var(--accent-soft)}
  .msg.ok{border-color:var(--ok);background:var(--ok-soft)}
  .loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:24px 0}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Sign in */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
  .login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);padding:32px}
  .login-card h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:8px 0 6px}

  /* Shell */
  .top{border-bottom:1px solid var(--line);background:var(--bg)}
  .top-in{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
  .brand b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.2}
  .tabs{display:flex;gap:4px;margin-left:12px}
  .tab{background:none;border:0;padding:8px 12px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--ink);border-color:var(--ink);font-weight:500}
  .sp{flex:1}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px}

  /* Composer */
  .composer{background:var(--card);border:1px solid var(--line)}
  .row{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--line);min-height:52px}
  .row > .k{font-size:13px;color:var(--muted);font-weight:500}
  .row input,.row select{border:0;padding:8px 0}
  .row input:focus,.row select:focus{border:0}
  .from-row{grid-template-columns:72px 1.3fr 1fr}
  .from-row .nm{border-left:1px solid var(--line);padding-left:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:36px;cursor:text}
  .chips input{flex:1;min-width:160px;border:0;padding:6px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--off);padding:4px 6px 4px 10px;font-size:13px;max-width:100%}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
  .chip.bad{background:var(--accent-soft);color:var(--accent);outline:1px dashed var(--accent)}
  .ccbcc{display:flex;gap:12px}
  .subject input{font-size:16px;font-weight:500}

  .toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fcfbf9}
  .tb{background:none;border:1px solid transparent;width:34px;height:32px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .tb:hover{border-color:var(--line);background:#fff}
  .tb svg{width:16px;height:16px}
  .tb-sep{width:1px;background:var(--line);margin:4px 6px}
  .linkbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fcfbf9}
  .linkbar input{flex:1;padding:7px 10px}
  .editor{min-height:280px;padding:18px;outline:none;font-size:15px;line-height:1.6}
  .editor:empty:before{content:attr(data-ph);color:#b3aa9d}
  .editor a{color:var(--accent)}
  .editor ul,.editor ol{padding-left:22px}

  .attach{border-top:1px solid var(--line);padding:14px 18px}
  .drop{border:1px dashed #cfc6b8;padding:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;transition:all .12s}
  .drop:hover,.drop.over{border-color:var(--ink);color:var(--ink);background:#fcfbf9}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 8px 6px 10px;font-size:13px;background:#fff;max-width:100%}
  .file svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
  .file .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
  .file .s{color:var(--muted);font-size:12px}
  .file button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}

  .foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);background:#fcfbf9}
  .opts{display:flex;flex-wrap:wrap;gap:18px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin:0;font-weight:400}
  .check input{width:17px;height:17px;padding:0}
  .check small{color:var(--muted)}

  /* Sent */
  .sent{background:var(--card);border:1px solid var(--line);margin-bottom:8px}
  .sent-h{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 16px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
  .sent-h:hover{background:#fcfbf9}
  .sent-h b{display:block;font-weight:600}
  .sent-h .to{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sent-h .r{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
  .tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 7px;margin-left:4px}
  .tag.open{background:var(--ok-soft);color:var(--ok)} .tag.no{background:var(--off);color:var(--muted)} .tag.fail{background:var(--accent-soft);color:var(--accent)}
  .sent-b{border-top:1px solid var(--line);padding:14px 16px;font-size:14px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px}
  .kv dt{color:var(--muted)} .kv dd{word-break:break-word}
  .empty{color:var(--muted);padding:22px;border:1px dashed var(--line);text-align:center;background:var(--card);font-size:14px}

  @media (max-width:640px){
    .top-in{padding:12px 16px;flex-wrap:wrap}
    .tabs{margin-left:0;order:3;width:100%}
    .wrap{padding:16px 12px 48px}
    .row{grid-template-columns:52px 1fr auto;padding:6px 12px}
    .from-row{grid-template-columns:52px 1fr}
    .from-row .nm{grid-column:2;border-left:0;padding-left:0;border-top:1px solid var(--line)}
    .editor{padding:14px 12px;min-height:220px}
    .attach,.foot{padding:12px}
    .kv{grid-template-columns:1fr}
    .file .n{max-width:150px}
  }
</style>
</head>
<body>

<!-- ================= SIGN IN ================= -->
<div class="login" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="eyebrow">Fenil Book · Mail</div>
    <h1>Sign in</h1>
    <p class="note" style="margin-bottom:20px">Use your owner password.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" maxlength="200">
    <div style="margin-top:18px"><button class="btn" type="submit" id="loginBtn" style="width:100%">Sign in</button></div>
    <div id="loginMsg" class="msg hidden"></div>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="top"><div class="top-in">
    <div class="brand"><span class="eyebrow">Mail</span><b id="ownerName">Fenil Pritesh Shah</b></div>
    <nav class="tabs"><button class="tab active" data-t="compose">Compose</button><button class="tab" data-t="sent">Sent</button></nav>
    <div class="sp"></div>
    <button class="btn ghost sm" id="logoutBtn" type="button">Sign out</button>
  </div></header>

  <div class="wrap">
    <div id="pageMsg" class="msg hidden" style="margin:0 0 14px"></div>

    <!-- Compose -->
    <section id="composeView">
      <div id="sendersLoading" class="loading"><div class="spin"></div>Loading your addresses…</div>
      <form class="composer hidden" id="composer" novalidate>
        <div class="row from-row">
          <span class="k">From</span>
          <select id="from"></select>
          <input class="nm" id="fromName" placeholder="Sender name" maxlength="80">
        </div>
        <div class="row"><span class="k">To</span><div class="chips" data-field="to"><input list="recent" autocomplete="off" placeholder="Add recipients"></div>
          <div class="ccbcc"><button type="button" class="linkbtn" id="showCc">Cc</button><button type="button" class="linkbtn" id="showBcc">Bcc</button></div></div>
        <div class="row hidden" id="ccRow"><span class="k">Cc</span><div class="chips" data-field="cc"><input list="recent" autocomplete="off"></div><span></span></div>
        <div class="row hidden" id="bccRow"><span class="k">Bcc</span><div class="chips" data-field="bcc"><input list="recent" autocomplete="off"></div><span></span></div>
        <div class="row subject"><span class="k">Subject</span><input id="subject" maxlength="300"><span></span></div>

        <div class="toolbar" id="toolbar">
          <button type="button" class="tb" data-cmd="bold" title="Bold"><b>B</b></button>
          <button type="button" class="tb" data-cmd="italic" title="Italic"><i style="font-family:Georgia">I</i></button>
          <button type="button" class="tb" data-cmd="underline" title="Underline"><u>U</u></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb" data-cmd="insertUnorderedList" title="Bulleted list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
          <button type="button" class="tb" data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10M4 4v4M3 8h2M3 14c0-1 2-1.5 2 0 0 1-2 2-2 2h2M3 18.5c1-.8 2-.5 2 .2 0 .9-2 .8-2 .8"/></svg></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb" data-cmd="link" title="Insert link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
          <button type="button" class="tb" data-cmd="removeFormat" title="Clear formatting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V4h16v3M9 20h6M12 4 9 20M3 3l18 18"/></svg></button>
        </div>
        <div class="linkbar hidden" id="linkbar"><input id="linkUrl" placeholder="https://…"><button type="button" class="btn sm" id="linkApply">Add link</button><button type="button" class="linkbtn" id="linkCancel" style="color:var(--muted)">Cancel</button></div>
        <div class="editor" id="editor" contenteditable="true" data-ph="Write your message…"></div>

        <div class="attach">
          <div class="drop" id="drop">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-3px;margin-right:6px"><path d="m21 12-8.5 8.5a6 6 0 0 1-8.5-8.5L13 3a4 4 0 0 1 5.7 5.7L10 17.4a2 2 0 0 1-2.8-2.8L15 7"/></svg>
            Drop files here or <b>choose files</b> <span class="note">· up to 20 MB in total</span>
          </div>
          <input type="file" id="fileInput" multiple class="hidden">
          <div class="files" id="files"></div>
        </div>

        <div class="foot">
          <div class="opts">
            <label class="check"><input type="checkbox" id="receipt" checked> Request read receipt</label>
            <label class="check"><input type="checkbox" id="track" checked> Track opens <small>(shown in Sent)</small></label>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button type="button" class="linkbtn" id="discard" style="color:var(--muted)">Discard</button>
            <button class="btn" type="submit" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>Send</button>
          </div>
        </div>
      </form>
      <div id="sendMsg" class="msg hidden"></div>
      <datalist id="recent"></datalist>
    </section>

    <!-- Sent -->
    <section id="sentView" class="hidden"><div id="sentBody"></div></section>
  </div>
</div>

<script>
/* ====== YOUR APPS SCRIPT WEB APP URL (same as the booking page) ====== */
const SCRIPT_URL = FPS.API + '/book';

const $=id=>document.getElementById(id);
const S={token:null,senders:[],files:[],maxBytes:20*1024*1024,open:{}};
const EMAIL=/^[^\s@,;<>"]+@[^\s@,;<>"]+\.[^\s@,;<>"]{2,}$/;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(el,on){el.classList.toggle('hidden',!on)}
function msg(el,t,ok){el.textContent=t||'';el.classList.toggle('ok',!!ok);show(el,!!t)}
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}

async function call(op,data){
  let res;
  try{ res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:'admin',op,token:S.token},data||{}))}); }
  catch(e){ throw new Error('Could not reach the server. Please try again. (code: NET)'); }
  if(!res.ok) throw new Error('Could not reach the server. (code: '+res.status+')');
  let d; try{ d=JSON.parse(await res.text()); }catch(e){ throw new Error('The server is not responding correctly. (code: HTML)'); }
  if(d.signedOut){ signOut(d.error); throw new Error(d.error); }
  return d;
}

/* ---------- sign in ---------- */
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  const pw=$('pw').value; if(!pw) return msg($('loginMsg'),'Please enter your password.');
  const b=$('loginBtn'); b.disabled=true; b.textContent='Signing in…'; msg($('loginMsg'),'');
  try{
    const d=await call('login',{password:pw});
    if(!d.ok) return msg($('loginMsg'),d.error||'Could not sign in.');
    S.token=d.token; $('pw').value=''; if(d.owner) $('ownerName').textContent=d.owner;
    show($('loginView'),false); show($('app'),true); loadSenders();
  }catch(err){ msg($('loginMsg'),err.message); }
  finally{ b.disabled=false; b.textContent='Sign in'; }
};
function signOut(reason){ S.token=null; show($('app'),false); show($('loginView'),true); msg($('loginMsg'),reason||''); }
$('logoutBtn').onclick=async()=>{ try{ await call('logout'); }catch(e){} signOut(''); msg($('loginMsg'),'Signed out.',true); };

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  show($('composeView'),t.dataset.t==='compose'); show($('sentView'),t.dataset.t==='sent');
  msg($('pageMsg'),'');
  if(t.dataset.t==='sent') loadSent();
});

/* ---------- senders ---------- */
async function loadSenders(){
  show($('sendersLoading'),true); show($('composer'),false);
  try{
    const d=await call('mailSenders'); if(!d.ok) throw new Error(d.error);
    S.senders=d.senders; S.maxBytes=d.maxBytes||S.maxBytes;
    const sel=$('from'); sel.innerHTML=d.senders.map(x=>'<option value="'+esc(x.address)+'">'+esc(x.address)+'</option>').join('');
    if(d.defaultFrom && d.senders.some(x=>x.address===d.defaultFrom.toLowerCase())) sel.value=d.defaultFrom.toLowerCase();
    sel.onchange=()=>{ const s=S.senders.find(x=>x.address===sel.value); $('fromName').value=(s&&s.name)||d.defaultName||''; };
    sel.onchange();
    $('recent').innerHTML=(d.recent||[]).map(a=>'<option value="'+esc(a)+'">').join('');
    show($('composer'),true);
  }catch(e){ msg($('pageMsg'),e.message); }
  finally{ show($('sendersLoading'),false); }
}

/* ---------- recipient chips ---------- */
const lists={to:[],cc:[],bcc:[]};
document.querySelectorAll('.chips').forEach(box=>{
  const field=box.dataset.field, inp=box.querySelector('input');
  box.onclick=e=>{ if(e.target===box) inp.focus(); };
  const commit=()=>{ const parts=inp.value.split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean); if(!parts.length) return;
    parts.forEach(p=>{ const v=p.replace(/^.*<([^>]+)>.*$/,'$1').toLowerCase(); if(!lists[field].includes(v)) lists[field].push(v); });
    inp.value=''; renderChips(field); };
  inp.addEventListener('keydown',e=>{
    if(['Enter',',',';','Tab'].includes(e.key) && inp.value.trim()){ e.preventDefault(); commit(); }
    else if(e.key==='Backspace' && !inp.value && lists[field].length){ lists[field].pop(); renderChips(field); }
  });
  inp.addEventListener('blur',commit);
  inp.addEventListener('paste',()=>setTimeout(commit,0));
  inp.addEventListener('change',()=>{ if(EMAIL.test(inp.value.trim())) commit(); });
});
function renderChips(field){
  const box=document.querySelector('.chips[data-field="'+field+'"]'), inp=box.querySelector('input');
  box.querySelectorAll('.chip').forEach(c=>c.remove());
  lists[field].forEach((a,i)=>{
    const c=document.createElement('span'); c.className='chip'+(EMAIL.test(a)?'':' bad'); c.title=EMAIL.test(a)?a:'Not a valid email address';
    c.innerHTML='<span>'+esc(a)+'</span><button type="button" aria-label="Remove">×</button>';
    c.querySelector('button').onclick=()=>{ lists[field].splice(i,1); renderChips(field); };
    box.insertBefore(c,inp);
  });
}
$('showCc').onclick=()=>{ show($('ccRow'),true); $('showCc').classList.add('hidden'); $('ccRow').querySelector('input').focus(); };
$('showBcc').onclick=()=>{ show($('bccRow'),true); $('showBcc').classList.add('hidden'); $('bccRow').querySelector('input').focus(); };

/* ---------- editor ---------- */
document.querySelectorAll('#toolbar .tb').forEach(b=>b.onmousedown=e=>{
  e.preventDefault();
  const cmd=b.dataset.cmd;
  if(cmd==='link'){
    const sel=window.getSelection();
    if(!sel.rangeCount||sel.isCollapsed||!$('editor').contains(sel.anchorNode)){ msg($('sendMsg'),'Select some text in the message first, then click the link button.'); return; }
    S.range=sel.getRangeAt(0).cloneRange(); show($('linkbar'),true); $('linkUrl').value=''; $('linkUrl').focus(); return;
  }
  document.execCommand(cmd,false,null);
  $('editor').focus();
});
function applyLink(){
  let url=$('linkUrl').value.trim(); show($('linkbar'),false); if(!url||!S.range) return;
  if(!/^(https?:|mailto:)/i.test(url)) url=(EMAIL.test(url)?'mailto:':'https://')+url;
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(S.range);
  document.execCommand('createLink',false,url); S.range=null; msg($('sendMsg'),'');
}
$('linkApply').onclick=applyLink;
$('linkUrl').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); applyLink(); } if(e.key==='Escape') show($('linkbar'),false); });
$('linkCancel').onclick=()=>show($('linkbar'),false);
$('editor').addEventListener('paste',e=>{
  // paste as clean text to avoid bringing in page styles
  e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});

/* ---------- attachments ---------- */
const drop=$('drop'), fi=$('fileInput');
drop.onclick=()=>fi.click();
fi.onchange=()=>{ addFiles(fi.files); fi.value=''; };
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function totalSize(){ return S.files.reduce((a,f)=>a+f.size,0); }
function addFiles(list){
  Array.from(list).forEach(f=>{
    if(S.files.length>=15) return msg($('sendMsg'),'Up to 15 attachments per email.');
    if(totalSize()+f.size>S.maxBytes) return msg($('sendMsg'),'"'+f.name+'" would take attachments over 20 MB in total.');
    S.files.push(f);
  });
  renderFiles();
}
function renderFiles(){
  $('files').innerHTML=S.files.map((f,i)=>'<span class="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'+
    '<span class="n">'+esc(f.name)+'</span><span class="s">'+size(f.size)+'</span><button type="button" data-i="'+i+'" aria-label="Remove">×</button></span>').join('')+
    (S.files.length?'<span class="note" style="align-self:center">'+size(totalSize())+' total</span>':'');
  $('files').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.files.splice(+b.dataset.i,1); renderFiles(); });
}
function readB64(f){ return new Promise((ok,fail)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>fail(new Error('Could not read "'+f.name+'".')); r.readAsDataURL(f); }); }

/* ---------- send ---------- */
function resetComposer(){
  ['to','cc','bcc'].forEach(k=>{ lists[k]=[]; renderChips(k); });
  $('subject').value=''; $('editor').innerHTML=''; S.files=[]; renderFiles();
  show($('ccRow'),false); show($('bccRow'),false); $('showCc').classList.remove('hidden'); $('showBcc').classList.remove('hidden');
}
(function(){ let armed=false; const d=$('discard');
  d.onclick=()=>{ if(!$('subject').value&&!$('editor').textContent.trim()&&!lists.to.length&&!S.files.length) return;
    if(!armed){ armed=true; d.textContent='Tap again to discard'; d.style.color='var(--accent)'; setTimeout(()=>{ armed=false; d.textContent='Discard'; d.style.color='var(--muted)'; },3500); return; }
    armed=false; d.textContent='Discard'; d.style.color='var(--muted)'; resetComposer(); msg($('sendMsg'),''); };
})();

$('composer').onsubmit=async e=>{
  e.preventDefault();
  document.querySelectorAll('.chips input').forEach(i=>i.dispatchEvent(new Event('blur')));
  const all=[...lists.to,...lists.cc,...lists.bcc];
  if(!lists.to.length) return msg($('sendMsg'),'Add at least one recipient in To.');
  const bad=all.filter(a=>!EMAIL.test(a)); if(bad.length) return msg($('sendMsg'),'Please fix: '+bad.join(', '));
  const subject=$('subject').value.trim(); if(!subject) return msg($('sendMsg'),'Please add a subject.');
  const html=$('editor').innerHTML;
  if(!$('editor').textContent.trim() && !S.files.length) return msg($('sendMsg'),'The message is empty.');
  const btn=$('sendBtn'); btn.disabled=true; const label=btn.innerHTML; btn.lastChild.textContent=S.files.length?'Uploading…':'Sending…'; msg($('sendMsg'),'');
  try{
    const attachments=[];
    for(const f of S.files) attachments.push({name:f.name,type:f.type,data:await readB64(f)});
    const body='<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#1b1a17">'+html+'</div>';
    const r=await call('sendMail',{from:$('from').value,fromName:$('fromName').value.trim(),to:lists.to,cc:lists.cc,bcc:lists.bcc,
      subject,html:body,attachments,readReceipt:$('receipt').checked,trackOpens:$('track').checked});
    if(!r.ok) throw new Error(r.error||'Could not send.');
    const n=all.length;
    resetComposer();
    msg($('sendMsg'),'Sent to '+n+' recipient'+(n===1?'':'s')+'.'+(r.note||'')+(r.tracked?' Opens will appear in the Sent tab.':''),true);
  }catch(err){ msg($('sendMsg'),err.message); }
  finally{ btn.disabled=false; btn.innerHTML=label; }
};

/* ---------- sent ---------- */
async function loadSent(){
  $('sentBody').innerHTML='<div class="loading"><div class="spin"></div>Loading…</div>';
  try{
    const d=await call('sentMail'); if(!d.ok) throw new Error(d.error);
    S.sent=d.mails; renderSent();
  }catch(e){ $('sentBody').innerHTML=''; msg($('pageMsg'),e.message); }
}
function renderSent(){
  if(!S.sent.length){ $('sentBody').innerHTML='<div class="empty">Nothing sent from here yet.</div>'; return; }
  $('sentBody').innerHTML=S.sent.map(m=>{
    const failed=/^Failed/.test(m.status);
    const tag=failed?'<span class="tag fail">Failed</span>':m.track==='Yes'?(m.opens?'<span class="tag open">Opened'+(m.opens>1?' ×'+m.opens:'')+'</span>':'<span class="tag no">Not opened yet</span>'):'';
    let h='<div class="sent"><button class="sent-h" data-id="'+esc(m.id)+'"><div style="min-width:0"><b>'+esc(m.subject)+'</b><div class="to">To: '+esc(m.to)+(m.attachments?' · 📎':'')+'</div></div>'+
      '<div class="r">'+esc(m.sent)+'<br>'+tag+(m.receipt==='Yes'?'<span class="tag no">Receipt asked</span>':'')+'</div></button>';
    if(S.open[m.id]) h+='<div class="sent-b"><dl class="kv">'+kv('From',m.from)+kv('To',m.to)+kv('Cc',m.cc)+kv('Bcc',m.bcc)+kv('Attachments',m.attachments)+
      kv('Read receipt',m.receipt==='Yes'?'Requested — receipts arrive in the '+m.from.replace(/^.*<|>$/g,'')+' inbox if the recipient sends one':'Not requested')+
      kv('Open tracking',m.track==='Yes'?(m.opens?'Opened '+m.opens+' time'+(m.opens>1?'s':'')+' · first '+m.first+' · last '+m.last:'Not opened yet'):'Off')+
      kv('Status',m.status)+kv('Mail ID',m.id)+'</dl></div>';
    return h+'</div>';
  }).join('');
  $('sentBody').querySelectorAll('.sent-h').forEach(b=>b.onclick=()=>{ S.open[b.dataset.id]=!S.open[b.dataset.id]; renderSent(); });
}
function kv(k,v){ return v?'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>':''; }

$('pw').focus();
</script>

/* fenilpshah.com/admin: use the session from the main admin sign-in */
(function(){
  const inFrame = window.self !== window.top;
  if (inFrame) document.documentElement.classList.add('embedded');
  const _so = window.signOut;
  signOut = function(r){ try { sessionStorage.removeItem('fps_admin_token'); } catch(e){} if (inFrame) { try { parent.postMessage('fps-signed-out', location.origin); } catch(e){} } return _so(r); };
  let t = null; try { t = sessionStorage.getItem('fps_admin_token'); } catch(e){}
  if (t) { S.token = t; show($('loginView'), false); show($('app'), true); loadSenders(); }
  else if (inFrame) { try { parent.postMessage('fps-signed-out', location.origin); } catch(e){} }
})();
</script>
