<style>
/* =========================================================
   ઓટલો · Otlo — otlo.fenilpshah.com
   Content comes from the Google Sheet (see OTLO_API below).
   ========================================================= */
:root{
  --red:#B81D24;
  --red-deep:#8E1419;
  --red-soft:#F8ECEA;
  --ink:#1D1A18;
  --muted:#6B6460;
  --line:#EBDCD9;
  --paper:#FFFFFF;
  --max:1120px;
  --gu:"Noto Serif Gujarati",serif;
  --display:"Fraunces",Georgia,serif;
  --body:"Source Serif 4",Georgia,serif;
  --ui:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
@media(min-width:720px){.wrap{padding:0 32px}}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:46px;width:auto;display:block}
.hero h1 .wm{width:min(100%,560px);height:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.brand .gu{font-family:var(--gu);font-weight:700;color:var(--red);font-size:30px;line-height:1}
.brand .en{font-family:var(--ui);font-size:10px;letter-spacing:.32em;color:var(--red);font-weight:600;margin-top:4px}
nav.main{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.main::-webkit-scrollbar{display:none}
nav.main a{font-family:var(--ui);font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px;white-space:nowrap;color:var(--ink)}
nav.main a:hover{background:var(--red-soft)}
nav.main a.on{background:var(--red);color:#fff}
@media(max-width:719px){.top .wrap{padding-top:10px;padding-bottom:6px}nav.main{width:100%;margin:0 -12px}}

/* ---------- patterns & media ---------- */
.media{position:relative;overflow:hidden;background:var(--red-soft)}
.media::before{content:"";position:absolute;inset:0;background-size:44px 44px;background-position:center}
.gal .media.noimg{aspect-ratio:4/5}
.gal figure:nth-child(3n+2) .media.noimg{aspect-ratio:1/1}
.gal figure:nth-child(3n) .media.noimg{aspect-ratio:3/4}
.prose .fig .media.noimg{aspect-ratio:16/9}
.media img{position:relative;width:100%;height:100%;object-fit:cover}
.media .ph{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-deep)}
.arch{border-radius:999px 999px 6px 6px}

/* ---------- hero ---------- */
.hero{padding:48px 0 40px;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;gap:36px;align-items:center}
@media(min-width:880px){.hero .wrap{grid-template-columns:1.15fr .85fr;gap:64px}.hero{padding:80px 0 72px}}
.kicker{font-family:var(--ui);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);font-weight:600}
.hero h1{font-family:var(--gu);font-weight:700;color:var(--red);font-size:clamp(72px,14vw,148px);line-height:1.05;margin:10px 0 0}
.hero .sub{font-family:var(--display);font-size:clamp(24px,3.2vw,34px);line-height:1.2;margin-top:8px}
.hero p.lead{color:var(--muted);margin-top:20px;max-width:34em}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{font-family:var(--ui);font-size:15px;font-weight:500;padding:12px 20px;border-radius:999px;border:1.5px solid var(--red);color:var(--red);transition:.2s}
.btn.solid{background:var(--red);color:#fff}
.btn:hover{background:var(--red-deep);border-color:var(--red-deep);color:#fff}
.hero .media{aspect-ratio:4/5;max-width:420px;width:100%;justify-self:center}
.steps{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin-top:-1px}

/* ---------- sections ---------- */
section.block{padding:56px 0}
section.block+section.block{border-top:1px solid var(--line)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.head h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.4vw,38px);line-height:1.15}
.head h2 .gu{font-family:var(--gu);color:var(--red);font-size:.7em;margin-left:10px;font-weight:500}
.more{font-family:var(--ui);font-size:14px;color:var(--red);font-weight:500;border-bottom:1px solid currentColor}

/* featured */
.feature{display:grid;gap:28px;align-items:center}
@media(min-width:880px){.feature{grid-template-columns:1.2fr 1fr;gap:48px}}
.feature .media{aspect-ratio:16/11;border-radius:6px}
.feature h3{font-family:var(--display);font-size:clamp(28px,3.6vw,42px);line-height:1.12;font-weight:600;margin:10px 0 14px}
.feature p{color:var(--muted)}
.tag{display:inline-flex;gap:8px;align-items:center;font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.tag i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}

/* clusters */
.clusters{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:720px){.clusters{grid-template-columns:repeat(4,1fr);gap:20px}}
.cl{display:block;group:1}
.cl .media{aspect-ratio:3/4;transition:transform .35s}
.cl:hover .media{transform:translateY(-4px)}
.cl .gu{font-family:var(--gu);color:var(--red);font-size:20px;margin-top:12px;line-height:1.3}
.cl h4{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25}
.cl p{font-size:15px;color:var(--muted);line-height:1.45;margin-top:4px}

/* post cards */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--ui);font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.posts{display:grid;gap:36px 28px}
@media(min-width:720px){.posts{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.posts{grid-template-columns:repeat(3,1fr)}}
.card .media{aspect-ratio:3/2;border-radius:6px;margin-bottom:16px}
.card h3{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2;margin:8px 0}
.card:hover h3{color:var(--red)}
.card p{font-size:16px;color:var(--muted);line-height:1.5}
.meta{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:10px}

/* gallery */
.gal{columns:2;column-gap:12px}
@media(min-width:720px){.gal{columns:3;column-gap:16px}}
.gal figure{break-inside:avoid;margin-bottom:12px;cursor:zoom-in}
.gal .media{border-radius:4px}
.gal figcaption{font-family:var(--ui);font-size:13px;color:var(--muted);padding:6px 2px 4px}

/* calendar */
.cal{display:grid;gap:0;border-top:1px solid var(--line)}
.ev .d b.rng{font-size:28px;white-space:nowrap}
.ev{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
.ev .d{font-family:var(--display);color:var(--red);line-height:1}
.ev .d b{display:block;font-size:40px;font-weight:600}
.ev .d span{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.ev .d.every{font-family:var(--ui);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding-top:6px}
.ev h4{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.25}
.ev p{font-size:16px;color:var(--muted);margin-top:4px}
.ev a.lnk{font-family:var(--ui);font-size:13px;color:var(--red);border-bottom:1px solid currentColor;display:inline-block;margin-top:6px}

/* page header */
.phead{padding:56px 0 36px;border-bottom:1px solid var(--line)}
.phead .gu{font-family:var(--gu);color:var(--red);font-size:clamp(40px,7vw,72px);line-height:1.2;font-weight:700}
.phead h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,5vw,52px);line-height:1.1;margin-top:6px}
.phead p{color:var(--muted);margin-top:12px;max-width:36em}

/* article */
.art-head{padding:48px 0 28px;max-width:760px;margin:0 auto}
.art-head h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,5.4vw,58px);line-height:1.08;margin:14px 0 16px}
.art-head .dek{font-size:21px;color:var(--muted);line-height:1.5}
.art-cover{max-width:1000px;margin:0 auto}
.art-cover .media{aspect-ratio:16/9;border-radius:6px}
.prose{max-width:680px;margin:40px auto 0;font-size:20px;line-height:1.75}
.prose p{margin:0 0 1.15em}
.prose h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;margin:1.6em 0 .6em}
.prose blockquote{border-left:3px solid var(--red);padding:4px 0 4px 22px;margin:1.6em 0;font-family:var(--display);font-style:italic;font-size:24px;line-height:1.4;color:var(--red-deep)}
.prose a{color:var(--red);border-bottom:1px solid currentColor}
.prose .fig{margin:1.8em 0}
.prose .fig .media{border-radius:4px}
.prose figcaption{font-family:var(--ui);font-size:14px;color:var(--muted);margin-top:8px}
.prose > p:first-child::first-letter{font-family:var(--display);float:left;font-size:3.6em;line-height:.85;padding:6px 10px 0 0;color:var(--red);font-weight:600}
.back{font-family:var(--ui);font-size:14px;color:var(--red);display:inline-flex;gap:6px}

/* about */
.about{max-width:680px}
.about p{font-size:20px;line-height:1.7;margin-bottom:1em}

/* footer */
footer{background:var(--red);color:#fff;margin-top:72px;padding:56px 0 40px}
footer .wrap{display:grid;gap:28px}
@media(min-width:720px){footer .wrap{grid-template-columns:1.4fr 1fr 1fr}}
footer .gu{font-family:var(--gu);font-size:44px;font-weight:700;line-height:1.1}
footer p,footer a{font-family:var(--ui);font-size:14px;opacity:.9;line-height:1.7}
footer a{display:block}
footer a:hover{opacity:1;text-decoration:underline}
footer h5{font-family:var(--ui);font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px;opacity:.75}
footer .fine{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.25);padding-top:18px;font-size:12px;opacity:.75}

/* states */
.note{font-family:var(--ui);font-size:13px;background:var(--red-soft);color:var(--red-deep);text-align:center;padding:8px 16px}
.empty{font-family:var(--ui);color:var(--muted);padding:24px 0}
.loading{min-height:60vh;display:grid;place-items:center}
.loading .gu{font-family:var(--gu);color:var(--red);font-size:56px;font-weight:700;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,10,10,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:12px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-height:82vh;max-width:100%;object-fit:contain;border-radius:4px}
.lb p{color:#fff;font-family:var(--ui);font-size:14px;text-align:center;max-width:40em}
</style>
</head>

     body:"Walk into any pol in the old city in the evening and you will find people sitting on the otlo, the raised platform at the front of the house. It is not quite inside and not quite the street. It is the place in between, where a city talks to itself.\n\n## A step, not a stage\n\nThe otlo is not built for performance. Nobody is in charge of it. It is simply there, and over generations it has held gossip, arguments, advice, wedding plans and grief.\n\n> A city keeps its stories in the places where people sit down together.\n\nThis site tries to be that step for Amdavad: a place to slow down and look again at the pols, the stepwells, the crafts, the festivals and the food that make the city what it is."},

function media(url, alt, i, cls="", label=""){
  const u = imgUrl(url);
  return `<div class="media pat${(i||0) % PATS.length} ${cls}${u ? "" : " noimg"}">${u
    ? `<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">`
    : (label ? `<span class="ph">${esc(label)}</span>` : "")}</div>`;
}

// Simple formatting for post bodies written in the Sheet
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderBody(t){
  return String(t||"").replace(/\r/g,"").split(/\n\s*\n/).map((b,i) => {
    b = b.trim(); if(!b) return "";
    let m = b.match(/^!\[(.*?)\]\((.+?)\)$/);
    if(m) return `<figure class="fig">${media(m[2], m[1], i)}${m[1] ? `<figcaption>${esc(m[1])}</figcaption>` : ""}</figure>`;
    if(b.startsWith("## ")) return `<h2>${inline(b.slice(3))}</h2>`;
    if(b.startsWith(">")) return `<blockquote>${inline(b.replace(/^>\s?/gm,""))}</blockquote>`;
    return `<p>${inline(b).replace(/\n/g,"<br>")}</p>`;
  }).join("");
}

let D = null;
function normalise(d){
  const s = d.settings || {};
  const clusters = (d.clusters||[]).filter(c => c.id && c.name);
  const posts = (d.posts||[]).filter(p => p.slug && p.title && (p.published === undefined || p.published === "" || truthy(p.published)))
    .sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
  return {settings:s, clusters, posts, gallery:(d.gallery||[]).filter(g => g.image || g.caption), calendar:(d.calendar||[]).filter(e => e.title)};
}
async function load(){
  if(!OTLO_API){ $("#sampleNote").innerHTML = `<div class="note">Preview with sample content. Connect the Google Sheet to show your own.</div>`; return normalise(SAMPLE); }
  try{
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch(OTLO_API, {signal:ctrl.signal});
    if(!r.ok) throw new Error(r.status);
    return normalise(await r.json());
  }catch(e){
    console.error("Otlo: could not load the Sheet", e);
    $("#sampleNote").innerHTML = `<div class="note">Couldn't reach the Sheet right now, showing sample content.</div>`;
    return normalise(SAMPLE);
  }
}
const cluster = id => D.clusters.find(c => c.id === id);
const clusterIndex = id => Math.max(0, D.clusters.findIndex(c => c.id === id));

function tag(p){

}
function card(p, i){
  return `<a class="card reveal" href="#/p/${encodeURIComponent(p.slug)}">
    ${media(p.cover_image, p.title, clusterIndex(p.cluster) + i, "", "")}
    ${tag(p)}<h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p>
    <div class="meta">${[p.author, fmtDate(p.date)].filter(Boolean).map(esc).join(" · ")}</div></a>`;
}
function clusterTile(c, i){
  return `<a class="cl reveal" href="#/c/${encodeURIComponent(c.id)}">
    ${media(c.image, c.name, i, "arch")}

}
function eventRow(e){
  const a = parseDate(e.date), b = parseDate(e.end_date);
  let d;
  if(!a) d = `<div class="d every">${esc(e.when || "Ongoing")}</div>`;
  else if(b && (b.d !== a.d || b.m !== a.m)) d = `<div class="d"><b class="rng">${a.d}–${b.d}</b><span>${MONTHS[a.m]}${b.m !== a.m ? "–" + MONTHS[b.m] : ""} ${a.y}</span></div>`;
  else d = `<div class="d"><b>${a.d}</b><span>${MONTHS[a.m]} ${a.y}</span></div>`;
  const link = imgUrl(e.link) ? `<a class="lnk" href="${esc(e.link)}" target="_blank" rel="noopener">More</a>` : "";
  return `<div class="ev reveal">${d}<div><h4>${esc(e.title)}</h4><p>${[e.place, e.note].filter(Boolean).map(esc).join(" · ")}</p>${link}</div></div>`;
}
function upcoming(list){
  const now = new Date(), today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const dated = list.filter(e => parseDate(e.date) && (e.end_date || e.date) >= today).sort((a,b) => a.date.localeCompare(b.date));
  const ongoing = list.filter(e => !parseDate(e.date));
  return [...ongoing, ...dated];
}
function galleryGrid(items){
  if(!items.length) return `<div class="empty">No photos yet.</div>`;
  return `<div class="gal">${items.map((g,i) => `<figure class="reveal" data-i="${i}">

    ${g.caption || g.credit ? `<figcaption>${esc(g.caption)}${g.credit ? ` · ${esc(g.credit)}` : ""}</figcaption>` : ""}</figure>`).join("")}</div>`;
}

function postPage(slug){
  const p = D.posts.find(x => x.slug === slug); if(!p) return notFound();
  const more = D.posts.filter(x => x !== p && x.cluster === p.cluster).slice(0, 3);
  const extra = String(p.gallery || "").split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  return `<article><div class="wrap">
      <div class="art-head"><a class="back" href="#/">← Back</a><div style="margin-top:22px">${tag(p)}</div>
        <h1>${esc(p.title)}</h1>${p.excerpt ? `<p class="dek">${esc(p.excerpt)}</p>` : ""}
        <div class="meta">${[p.author, fmtDate(p.date)].filter(Boolean).map(esc).join(" · ")}</div></div>
      ${p.cover_image ? `<div class="art-cover">${media(p.cover_image, p.title, 1)}</div>` : ""}
      <div class="prose">${renderBody(p.body)}

    ${more.length ? `<section class="block" style="margin-top:56px"><div class="wrap"><div class="head"><h2>More from ${esc(cluster(p.cluster)?.name || "the otlo")}</h2></div>

}

/* ---------------- router ---------------- */
/* Navigation works even inside sandboxed frames (Google Sites embeds, previews):
   clicks are handled here instead of relying on the browser following "#/" links. */
let current = null, stack = [];
function hashPath(){ try{ return decodeURIComponent(location.hash.replace(/^#\/?/, "")); }catch(_){ return ""; } }
function go(path, push){
  path = String(path || "").replace(/^#?\/?/, "");
  if(path === current) return;
  if(push) stack.push(path); else stack = [path];
  current = path;
  if(push){ try{ history.pushState(null, "", "#/" + path); }catch(_){} }
  render(path);
}
function route(){ go(hashPath(), false); }
function render(h){
  const [a, b] = h.split("/").map(x => { try{ return decodeURIComponent(x); }catch(_){ return x; } });
  const views = {home, read, clusters:clustersPage, gallery:galleryPage, calendar:calendarPage, about:aboutPage};
  let html;
  if(a === "c" && b) html = clusterPage(b);
  else if(a === "p" && b) html = postPage(b);
  else html = (views[PAGE] || home)();
  $("#app").innerHTML = html;
  try{ window.scrollTo(0, 0); }catch(_){}
  observe();
}
let io;
function observe(){
  if(!("IntersectionObserver" in window)){ document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); return; }
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -6% 0px"});
  document.querySelectorAll(".reveal").forEach(e => io.observe(e));
}

/* chips + lightbox */
document.addEventListener("click", e => {
  const link = e.target.closest('a[href^="#/"], a[href="#"]');
  if(link){
    e.preventDefault();
    if(link.classList.contains("back") && stack.length > 1){ stack.pop(); const prev = stack.pop(); go(prev, true); return; }
    go(link.getAttribute("href").slice(1), true); return;
  }
  const chip = e.target.closest(".chip");
  if(chip){ filter = chip.dataset.f; render(current || ""); return; }
  const fig = e.target.closest(".gal figure");
  if(fig){
    const img = fig.querySelector("img"); if(!img) return;
    $("#lb img").src = img.src; $("#lb p").textContent = fig.querySelector("figcaption")?.textContent || "";
    $("#lb").classList.add("open"); return;
  }
  if(e.target.closest("#lb")) $("#lb").classList.remove("open");
});
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#lb").classList.remove("open"); });

(async () => {
  D = await load();
  window.addEventListener("hashchange", route);
  window.addEventListener("popstate", route);
  route();
})();
